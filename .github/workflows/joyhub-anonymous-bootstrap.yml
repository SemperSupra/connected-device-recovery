name: JOYHUB anonymous API evidence

on:
  pull_request:
    paths:
      - tools/probe_joyhub_anonymous_bootstrap.py
      - fixtures/joyhub/anonymous-api-evidence-2026-09-22.json
      - .github/workflows/joyhub-anonymous-bootstrap.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile explicit probe tool
        run: python -m py_compile tools/probe_joyhub_anonymous_bootstrap.py
      - name: Validate sanitized evidence fixture
        run: |
          python - <<'PY'
          import json
          p="fixtures/joyhub/anonymous-api-evidence-2026-09-22.json"
          d=json.load(open(p))
          assert d["schema"] == "cdr-joyhub-anonymous-api-evidence/v1"
          assert d["policy"]["credentials_used"] is False
          assert d["policy"]["authorization_header_sent"] is False
          assert d["policy"]["cookies_used"] is False
          assert d["policy"]["account_identifiers_used"] is False
          assert d["policy"]["raw_payloads_published"] is False
          runs={r["run_id"]:r for r in d["runs"]}
          first=runs[35749323392]
          appcfg=[r for r in first["results"] if r["endpoint"]=="api/cfg/appCfg"][0]
          assert appcfg["classification"]=="QUALIFIED_ANONYMOUS_READ"
          assert appcfg["app_code"]==0
          second=runs[35750023107]
          assert len(second["results"])==4
          assert all(r["classification"]=="APPLICATION_BOUNDARY" for r in second["results"])
          assert all(r["app_code"]==9000 for r in second["results"])
          print("JOYHUB anonymous API evidence fixture PASS")
          PY
