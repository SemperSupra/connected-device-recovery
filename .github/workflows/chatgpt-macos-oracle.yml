name: Characterize official ChatGPT macOS applications

on:
  pull_request:
    paths:
      - '.github/workflows/chatgpt-macos-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Discover official macOS installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/chatgpt-macos
          work="$(mktemp -d)"
          echo "WORK=$work" >> "$GITHUB_ENV"

          python3 - "$work" <<'PY'
          import json,re,sys,urllib.request,pathlib
          work=pathlib.Path(sys.argv[1])
          sources=[
            ("unified-doc","https://learn.chatgpt.com/docs/app.md"),
            ("download-page","https://chatgpt.com/download/"),
          ]
          found={}
          for label,url in sources:
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=30) as r:
                text=r.read().decode("utf-8","replace")
            except Exception:
              continue
            links=sorted(set(re.findall(r'https://persistent\.oaistatic\.com/[^\s\)>"\']+',text)))
            found[label]={"source_url":url,"candidate_urls":links}
          all_links=sorted(set(u for x in found.values() for u in x["candidate_urls"]))
          pathlib.Path("out/chatgpt-macos/discovery.json").write_text(
            json.dumps({"schema":"cdr-chatgpt-macos-discovery/v1","sources":found,"all_dmg_urls":all_links},indent=2,sort_keys=True)+"\n")
          if not all_links:
            raise SystemExit("no official macOS download candidates discovered")
          (work/"dmg-urls.txt").write_text("\n".join(all_links)+"\n")
          PY

      - name: Derive signed bundle and runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          : > out/chatgpt-macos/apps.ndjson
          index=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            index=$((index+1))
            dmg="$WORK/chatgpt-$index.dmg"
            curl --proto '=https' --tlsv1.2 -fL --retry 3 "$url" -o "$dmg"
            sha="$(shasum -a 256 "$dmg" | awk '{print $1}')"
            size="$(stat -f %z "$dmg")"

            attach="$WORK/attach-$index.txt"
            if ! hdiutil attach -nobrowse -readonly "$dmg" | tee "$attach"; then
              echo "candidate_not_mountable=$url" >> out/chatgpt-macos/skipped-candidates.txt
              rm -f "$dmg"
              continue
            fi
            volume="$(awk -F '\t' '$3 ~ /^\/Volumes\// {print $3}' "$attach" | tail -n1)"
            if [ -z "$volume" ]; then
              echo "mount point not found" >&2
              exit 21
            fi

            app="$(find "$volume" -maxdepth 2 -type d -name '*.app' -print -quit)"
            if [ -z "$app" ]; then
              hdiutil detach "$volume" || true
              echo "application bundle not found" >&2
              exit 22
            fi

            codesign -dv --verbose=4 "$app" > "$WORK/codesign-$index.txt" 2>&1 || true
            codesign -d --entitlements :- "$app" > "$WORK/entitlements-$index.plist" 2>/dev/null || true
            spctl -a -vv "$app" > "$WORK/spctl-$index.txt" 2>&1 || true

            python3 - "$app" "$url" "$sha" "$size" "$WORK/codesign-$index.txt" "$WORK/entitlements-$index.plist" "$WORK/spctl-$index.txt" >> out/chatgpt-macos/apps.ndjson <<'PY'
          import collections,json,pathlib,plistlib,subprocess,sys
          app=pathlib.Path(sys.argv[1]); url,sha,size=sys.argv[2:5]
          code=pathlib.Path(sys.argv[5]).read_text(errors="replace")
          ent_path=pathlib.Path(sys.argv[6]); spctl=pathlib.Path(sys.argv[7]).read_text(errors="replace")
          info={}
          with (app/"Contents/Info.plist").open("rb") as f: raw=plistlib.load(f)
          for k in ["CFBundleIdentifier","CFBundleName","CFBundleDisplayName","CFBundleShortVersionString","CFBundleVersion","LSMinimumSystemVersion","SUFeedURL","SUEnableAutomaticChecks"]:
            if k in raw: info[k]=raw[k]
          ents={}
          if ent_path.exists() and ent_path.stat().st_size:
            try:
              with ent_path.open("rb") as f: ents=plistlib.load(f)
            except Exception: ents={}
          ext=collections.Counter(); interesting=[]; macho=[]; frameworks=set()
          for p in app.rglob("*"):
            if not p.is_file(): continue
            rel=p.relative_to(app).as_posix()
            suffix=p.suffix.lower() or "<none>"; ext[suffix]+=1
            if "/Frameworks/" in "/"+rel:
              parts=rel.split("/")
              if "Frameworks" in parts:
                i=parts.index("Frameworks")
                if i+1<len(parts): frameworks.add(parts[i+1])
            if len(interesting)<600 and suffix in {".dylib",".framework",".js",".wasm",".pak",".node",".json",".plist"}:
              interesting.append(rel)
            try:
              out=subprocess.run(["file","-b",str(p)],capture_output=True,text=True,timeout=2).stdout
              if "Mach-O" in out and len(macho)<250: macho.append({"path":rel,"file":out.strip()[:240]})
            except Exception: pass
          print(json.dumps({
            "source_url":url,"dmg_sha256":sha,"dmg_size_bytes":int(size),
            "bundle":info,"codesign_summary":code[:4000],"spctl_summary":spctl[:2000],
            "entitlement_keys":sorted(str(k) for k in ents.keys()),
            "extension_counts":dict(ext.most_common()),"frameworks":sorted(frameworks),
            "interesting_paths":sorted(interesting),"mach_o_files":macho,
            "claim_boundary":"Derived signed-bundle evidence only; proprietary DMG/app bytes are not published."
          },sort_keys=True))
          PY

            hdiutil detach "$volume"
            rm -f "$dmg"
          done < "$WORK/dmg-urls.txt"

      - name: Prove proprietary installers are absent
        shell: bash
        run: |
          set -euo pipefail
          ! find out/chatgpt-macos -type f -name '*.dmg' | grep -q .

      - name: Upload derived macOS oracle evidence
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-macos-derived-oracle
          path: out/chatgpt-macos/
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup transient application bytes
        if: always()
        shell: bash
        run: rm -rf "$WORK" || true
