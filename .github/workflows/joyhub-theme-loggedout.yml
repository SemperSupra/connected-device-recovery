name: JOYHUB Theme logged-out evidence

on:
  pull_request:
    paths:
      - tools/probe_joyhub_theme_loggedout.py
      - fixtures/joyhub/theme-loggedout-2026-09-22.json
      - .github/workflows/joyhub-theme-loggedout.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile explicit one-shot probe
        run: python -m py_compile tools/probe_joyhub_theme_loggedout.py
      - name: Validate sanitized evidence
        run: |
          python - <<'PY'
          import json
          d=json.load(open("fixtures/joyhub/theme-loggedout-2026-09-22.json"))
          assert d["schema"]=="cdr-joyhub-theme-loggedout-evidence/v1"
          assert d["request"]["authorization_value"]=="empty"
          assert d["request"]["jh_user_id_value"]=="empty"
          assert d["request"]["account_identifier_sent"] is False
          assert d["request"]["request_count"]==1
          assert d["run"]["run_id"]==35751654477
          assert d["run"]["app_code"]==9000
          assert d["run"]["classification"]=="APPLICATION_BOUNDARY"
          assert d["policy"]["raw_payload_published"] is False
          print("Theme logged-out evidence PASS")
          PY
