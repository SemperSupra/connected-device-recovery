name: JOYHUB J-MowgliII wave-model probe
on:
  pull_request:
    paths:
      - tools/probe_joyhub_wave_model.py
      - .github/workflows/joyhub-wave-model.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m py_compile tools/probe_joyhub_wave_model.py
      - name: Execute exactly one read
        run: |
          mkdir -p out
          python tools/probe_joyhub_wave_model.py | tee out/summary.json
      - name: Validate safety envelope
        run: |
          python - <<'PY'
          import json
          d=json.load(open("out/summary.json"))
          assert d["schema"]=="cdr-joyhub-wave-model-probe/v1"
          assert d["policy"]["request_count"]==1
          assert d["policy"]["raw_payload_published"] is False
          assert d["policy"]["server_ids_guessed"] is False
          assert d["request"]["product_id"]=="320"
          assert d["request"]["account_identifier_sent"] is False
          print("policy gate PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: joyhub-wave-model-summary
          path: out/summary.json
          retention-days: 7
          if-no-files-found: error
